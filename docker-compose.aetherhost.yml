services:
  zebdecor-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zebdecor-spatial-commerce
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WORDPRESS_API_URL: ${WORDPRESS_API_URL:-}
      WORDPRESS_WEBHOOK_SECRET: ${WORDPRESS_WEBHOOK_SECRET:-zebdecor-wp-vip-hmac-secret-2026}
    ports:
      - '3000:3000'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=aetherhost-net'
      - 'traefik.http.routers.zebdecor-app.rule=Host(`zebdecor.localhost`) || Host(`zebdecor.aetherhost.com.ng`)'
      - 'traefik.http.services.zebdecor-app.loadbalancer.server.port=3000'
      - 'traefik.http.services.zebdecor-app.loadbalancer.healthcheck.path=/api/health'
      - 'traefik.http.services.zebdecor-app.loadbalancer.healthcheck.interval=15s'
    networks:
      - aetherhost-net

networks:
  aetherhost-net:
    external: true
